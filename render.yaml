# Free-tier: one web service serves the Vite build + API (backend/server.py).
# Connect this repo in Render → New → Blueprint, or create a Web Service manually
# with the same build/start commands.
#
# Note: Render free instances spin down after ~15 min idle (cold starts) and use
# ephemeral disk — school data in backend/data.json is lost on redeploy unless
# you attach a Render Disk (paid) or move storage elsewhere.

services:
  - type: web
    name: school-erp
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: python3 backend/server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_DOMAINS
        value: "*"

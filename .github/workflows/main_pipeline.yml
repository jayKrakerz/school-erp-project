name: School ERP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile and import authoritative backend
        env:
          SESSION_SECRET: ci-only-session-secret
        run: |
          python -m py_compile backend/server.py
          python -c "import backend.server; print('backend.server import passed')"

      - name: Run server foundation tests
        env:
          SESSION_SECRET: ci-only-session-secret
        run: python -m unittest backend.tests.server_foundation_tests

  deploy-backend:
    name: Deploy backend source to PythonAnywhere
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Upload authoritative backend and WSGI bridge
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          test -n "$PA_USERNAME"
          test -n "$PA_API_TOKEN"
          api="https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            -F "content=@backend/server.py;type=text/x-python" \
            "${api}/files/path/home/${PA_USERNAME}/backend/server.py"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            -F "content=@backend/wsgi.py;type=text/x-python" \
            "${api}/files/path/var/www/${PA_USERNAME}_pythonanywhere_com_wsgi.py"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "${api}/webapps/${PA_USERNAME}.pythonanywhere.com/reload/"

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: 59.1.3
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  health-check:
    name: Post-deploy health check
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check production login API
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          username = os.environ['PA_USERNAME']
          url = f'https://{username}.pythonanywhere.com/api/auth/login'
          request = urllib.request.Request(
              url,
              data=json.dumps({'email': 'healthcheck@erp.internal', 'password': 'bad'}).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  raise RuntimeError(f'Unexpected HTTP {response.status}; expected 401')
          except urllib.error.HTTPError as error:
              if error.code != 401:
                  raise
              print('Production API returned the expected 401 response')
          PYEOF
